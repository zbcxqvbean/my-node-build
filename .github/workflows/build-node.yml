name: Build node apk/ipk (immortalwrt / ipq40xx / ASUS RT-AC42U)

# ═══════════════════════════════════════════════════════════════════════
#  目标：在 immortalwrt master（默认 apk / apk-tools 3）上编译 nxhack node，
#        产物直接可装到 ASUS RT-AC42U(=ACRH17) / ipq40xx / arm_cortex-a7_neon-vfpv4。
#
#  打包格式：完全跟随源码自身设定，不写任何 CONFIG_USE_APK。
#        immortalwrt master（config/Config-build.in: USE_APK default y）→ .apk
#        coolsnowwolf/lede                                             → .ipk
#        编译前探测、编译后按实际产物二次确认。
#
#  apk 关键事实（来自 immortalwrt 自身源码，不是猜的）：
#    1) package/system/apk/Makefile: PKG_VERSION=3.0.5 → apk-tools 3
#    2) package/Makefile: PACKAGE_EXT=apk, 索引文件 = packages.adb
#    3) 索引生成 = apk mkndx --root .. --keys-dir .. --allow-untrusted -o packages.adb *.apk
#       （APKINDEX.tar.gz 是 apk-tools 2.x / 24.10 的老格式，apk 3 不认）
#    4) 包名 = <name><ABI>-<version>.apk，例如 node137-24.22.2-r1.apk
#    5) SIGN_EACH_PACKAGE 默认 y，单包编译不会自动生成密钥 → 本流程自己补生成
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "源码仓库（immortalwrt=apk，coolsnowwolf=ipk）"
        required: true
        default: "immortalwrt/immortalwrt"
        type: choice
        options:
          - immortalwrt/immortalwrt
          - coolsnowwolf/lede
      source_ref:
        description: "分支/tag（留空 = master，与本地固件同源）"
        required: false
        default: ""
      nxhack_branch:
        description: "nxhack 分支（auto = 按 source_ref 自动匹配）"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - master
          - openwrt-25.12
          - openwrt-24.10
      node_major:
        description: "node 主版本（24.10=20/22/24；25.12/master=22/24/26）"
        required: true
        default: "24"
        type: choice
        options:
          - "20"
          - "22"
          - "24"
          - "26"
      threads:
        description: "并行度（工具链 2 稳；node 阶段可 4）"
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "3"
          - "4"
      gen_index:
        description: "生成源索引（apk→packages.adb，ipk→Packages/Packages.gz）"
        required: true
        default: true
        type: boolean
      make_release:
        description: "编译成功后发布到 Releases"
        required: true
        default: true
        type: boolean
      runner_os:
        description: "runner（24.04 已验证）"
        required: true
        default: "ubuntu-24.04"
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-latest

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.source_repo }}-${{ github.event.inputs.node_major }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner_os }}
    timeout-minutes: 350

    steps:
      # ═══════════════════════════════════════════════════════════════
      # 1. 清盘：runner 只有 ~14G 可用，OpenWrt 全量编译 + node 很容易撑爆
      # ═══════════════════════════════════════════════════════════════
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /opt/az 2>/dev/null || true
          sudo apt-get clean
          df -h /
          free -h

      # ═══════════════════════════════════════════════════════════════
      # 2. 主机依赖：按源用它自己的官方清单
      #    immortalwrt → immortalwrt 的 install-deps 清单
      #    lede        → lede README 的清单
      #    仅做「Ubuntu 24.04 不存在该包名」的等价映射（已在 noble 索引核对）：
      #      gnutls-dev → libgnutls28-dev、libz-dev → zlib1g-dev、
      #      mkisofs → genisoimage、libncurses5-dev/libncursesw5-dev → libncurses-dev
      # ═══════════════════════════════════════════════════════════════
      - name: 安装主机依赖
        timeout-minutes: 30
        run: |
          export DEBIAN_FRONTEND=noninteractive
          REPO="${{ github.event.inputs.source_repo }}"

          IMM_DEPS=(
            ack antlr3 asciidoc autoconf automake autopoint binutils bison
            build-essential bzip2 ccache clang cmake cpio curl
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib
            g++-multilib git libgnutls28-dev gperf haveged help2man intltool
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev
            libreadline-dev libssl-dev libtool libyaml-dev lld llvm lrzsz
            genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf
            python3 python3-pip python3-ply python3-docutils python3-pyelftools
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          )

          LEDE_DEPS=(
            ack antlr3 asciidoc autoconf automake autopoint binutils bison
            build-essential bzip2 ccache clang cmake cpio curl
            device-tree-compiler flex gawk gcc-multilib g++-multilib gettext
            genisoimage git gperf haveged help2man intltool libc6-dev-i386
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev
            ninja-build p7zip p7zip-full patch pkgconf python3
            python3-pyelftools python3-setuptools qemu-utils rsync scons
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip
            vim wget xmlto xxd xz-utils zlib1g-dev
          )

          case "$REPO" in
            immortalwrt/immortalwrt) DEPS=("${IMM_DEPS[@]}"); DEPNAME="immortalwrt" ;;
            *)                        DEPS=("${LEDE_DEPS[@]}"); DEPNAME="coolsnowwolf/lede" ;;
          esac
          DEPS+=(libatomic1)   # nxhack README 要求

          mapfile -t DEPS < <(printf '%s\n' "${DEPS[@]}" | awk 'NF && !seen[$0]++')
          echo "════ 使用 $DEPNAME 官方依赖清单，共 ${#DEPS[@]} 个包 ════"

          APT="sudo -E apt-get -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          $APT update

          # 先按当前发行版实际可用的包名过滤：官方清单里个别包名在新版
          # Ubuntu 已改名/移除，只要有一个不存在，整条 apt install 会全部失败。
          AVAIL=(); MISSING=()
          for p in "${DEPS[@]}"; do
            if apt-cache show "$p" >/dev/null 2>&1; then AVAIL+=("$p"); else MISSING+=("$p"); fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "⚠ 该发行版无以下包名，已跳过: ${MISSING[*]}"
          fi
          $APT install --no-install-recommends "${AVAIL[@]}"

          echo "════ 关键工具自检 ════"
          miss=""
          for c in gcc g++ make cmake ninja python3 pkg-config swig dtc lld re2c zstd openssl; do
            p=$(command -v "$c" 2>/dev/null || true)
            if [ -n "$p" ]; then printf '  ✓ %-10s %s\n' "$c" "$p"
            else printf '  ✗ %-10s 缺失\n' "$c"; miss="$miss $c"; fi
          done
          [ -z "$miss" ] || { echo "❌ 关键工具缺失:$miss"; exit 1; }
          gcc --version | head -1
          python3 --version

      # ═══════════════════════════════════════════════════════════════
      # 3. 源码（--depth 1：省时省盘，只需要一个提交）
      # ═══════════════════════════════════════════════════════════════
      - name: 拉取源码
        run: |
          REPO="${{ github.event.inputs.source_repo }}"
          REF="${{ github.event.inputs.source_ref }}"
          [ -n "$REF" ] || REF=master

          echo "repo=$REPO  ref=$REF"
          echo "SOURCE_TAG=$(echo "$REPO" | tr '/' '-')-$(echo "$REF" | tr '/' '-')" >> "$GITHUB_ENV"

          git clone --depth 1 --single-branch --branch "$REF" \
            "https://github.com/$REPO.git" src \
          || { echo "浅克隆失败（可能是 SHA 或网络），改用完整克隆"; rm -rf src; \
               git clone "https://github.com/$REPO.git" src && git -C src checkout "$REF"; }
          cd src

          echo "== HEAD =="
          git log -1 --format="%H  %cd  %s"
          echo "== 架构 =="
          grep -E "^ARCH:=|^CPU_TYPE:=|^CPU_SUBTYPE:=" target/linux/ipq40xx/Makefile || true
          echo "== 内核版本 =="
          grep -E "KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER" target/linux/ipq40xx/Makefile || true
          echo "== 打包实现 =="
          if [ -f include/package-ipkg.mk ]; then echo "  package-ipkg.mk（老式，固定 ipk）"; fi
          if [ -f include/package-pack.mk ]; then echo "  package-pack.mk（双格式，看 CONFIG_USE_APK）"; fi
          USEAPK=$(awk '/^[[:space:]]*config USE_APK/{f=1} f&&/default/{print $2; exit}' \
                    config/Config-build.in 2>/dev/null || true)
          echo "  USE_APK 默认: ${USEAPK:-未找到（老式源码，只有 ipk）}"

          # nxhack 分支必须与源码同代，否则依赖名/ABI 对不上
          NXBRANCH="${{ github.event.inputs.nxhack_branch }}"
          if [ -z "$NXBRANCH" ] || [ "$NXBRANCH" = "auto" ]; then
            case "$REF" in
              openwrt-24.10*) NXBRANCH=openwrt-24.10 ;;
              openwrt-25.12*) NXBRANCH=openwrt-25.12 ;;
              *)              NXBRANCH=master ;;
            esac
          fi
          echo "NXBRANCH=$NXBRANCH" >> "$GITHUB_ENV"
          echo "=> source_ref=$REF  →  nxhack=$NXBRANCH"

      # ═══════════════════════════════════════════════════════════════
      # 4/5. 缓存
      # ═══════════════════════════════════════════════════════════════
      - name: 缓存 dl
        uses: actions/cache@v4
        with:
          path: src/dl
          key: dl-${{ github.event.inputs.source_repo }}-${{ hashFiles('src/include/version.mk') }}-v5
          restore-keys: |
            dl-${{ github.event.inputs.source_repo }}-
            dl-

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.event.inputs.source_repo }}-${{ github.event.inputs.node_major }}-${{ hashFiles('src/include/version.mk') }}-v5
          restore-keys: |
            ccache-${{ github.event.inputs.source_repo }}-${{ github.event.inputs.node_major }}-
            ccache-

      # ═══════════════════════════════════════════════════════════════
      # 6. 板级配置：只需要 arm_cortex-a7_neon-vfpv4
      # ═══════════════════════════════════════════════════════════════
      - name: 写入板级配置
        working-directory: src
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_asus_rt-ac42u=y
          CONFIG_TARGET_DEVICE_ipq40xx_generic_DEVICE_asus_rt-ac42u=y

          CONFIG_CCACHE=y
          EOF

          if grep -q "asus_rt-ac42u" target/linux/ipq40xx/image/generic.mk; then
            echo "✓ 设备定义存在: asus_rt-ac42u"
          else
            echo "⚠ 该源码没有 asus_rt-ac42u，继续按 Generic 编译（架构相同，不影响 node 包）"
            grep -oE "Device/asus_[a-z0-9_-]+" target/linux/ipq40xx/image/generic.mk || true
          fi

      # ═══════════════════════════════════════════════════════════════
      # 7. feeds
      # ═══════════════════════════════════════════════════════════════
      - name: 安装官方 feeds
        working-directory: src
        run: |
          ok=0
          for i in 1 2; do
            if ./scripts/feeds update -a; then ok=1; break; fi
            echo "feeds update 第 $i 次失败"
          done
          [ "$ok" = 1 ] || { echo "❌ feeds update 连续失败"; exit 1; }
          ./scripts/feeds install -a
          ls -d package/feeds/packages/node 2>/dev/null || echo "（packages feed 无 node，将以 nxhack 为准）"

      # ═══════════════════════════════════════════════════════════════
      # 8. nxhack（按 README 五步）
      # ═══════════════════════════════════════════════════════════════
      - name: 接入 nxhack node feed
        working-directory: src
        run: |
          NXBRANCH="${NXBRANCH}"
          echo "nxhack 分支: $NXBRANCH"

          sed -i '/openwrt-node-packages/d' feeds.conf.default
          echo "src-git node https://github.com/nxhack/openwrt-node-packages.git;$NXBRANCH" >> feeds.conf.default
          cat feeds.conf.default

          ./scripts/feeds update node

          # 删掉 packages feed 自带的 node / node-*
          rm -rf package/feeds/packages/node
          rm -rf package/feeds/packages/node-*

          ./scripts/feeds install -a -p node

          test -d package/feeds/node/node || { echo "❌ package/feeds/node/node 不存在"; exit 1; }
          ls package/feeds/node/
          git -C feeds/node log -1 --format="%H %cd %s" 2>/dev/null || true
          grep -E "^PKG_VERSION|^PKG_RELEASE" package/feeds/node/node/Makefile || true

      # ═══════════════════════════════════════════════════════════════
      # 9. 选版本 + defconfig + 格式判定
      # ═══════════════════════════════════════════════════════════════
      - name: 选择 node 版本并 defconfig
        working-directory: src
        run: |
          MAJOR="${{ github.event.inputs.node_major }}"
          echo "════ 目标 node ${MAJOR}.x ════"

          cat >> .config <<EOF
          CONFIG_NODEJS_${MAJOR}=y
          CONFIG_NODEJS_ICU_SMALL=y
          CONFIG_NODEJS_HOST_BIN=y
          CONFIG_PACKAGE_node=y
          CONFIG_PACKAGE_node-npm=y
          CONFIG_PACKAGE_libopenssl-legacy=y
          EOF

          make defconfig

          if ! grep -q "^CONFIG_NODEJS_${MAJOR}=y" .config; then
            echo "❌ 该 nxhack 分支不支持 node ${MAJOR}.x"
            grep -E "^CONFIG_NODEJS_|^# CONFIG_NODEJS_" .config || true
            echo "---- Makefile 支持列表 ----"
            grep -nE "config NODEJS_|default NODEJS_" package/feeds/node/node/Makefile || true
            echo "提示：openwrt-24.10 → 20/22/24；openwrt-25.12 或 master → 22/24/26"
            exit 1
          fi

          # 格式：完全按源码自身设定，不改 CONFIG_USE_APK
          PKG_FORMAT=ipk
          if grep -q "^CONFIG_USE_APK=y" .config; then
            PKG_FORMAT=apk
          elif [ ! -f include/package-ipkg.mk ] && grep -q "config USE_APK" config/Config-build.in; then
            PKG_FORMAT=apk
          fi
          echo "PKG_FORMAT=$PKG_FORMAT" >> "$GITHUB_ENV"
          echo "✅ 打包格式: $PKG_FORMAT（源码自身设定）"

          echo "════ 配置核对 ════"
          grep -E "CONFIG_TARGET_BOARD=|CONFIG_TARGET_PROFILE=|CONFIG_TARGET_ARCH_PACKAGES=|CONFIG_USE_APK|CONFIG_SIGN_EACH_PACKAGE" .config || true
          grep -E "^CONFIG_NODEJS_" .config || true
          grep -E "^CONFIG_PACKAGE_node" .config || true
          echo "架构: $(grep '^CONFIG_TARGET_ARCH_PACKAGES=' .config | cut -d'"' -f2)"

      # ═══════════════════════════════════════════════════════════════
      # 10. 下载 node 源码包（~90MB）
      # ═══════════════════════════════════════════════════════════════
      - name: 下载 node 源码包
        working-directory: src
        run: |
          make package/feeds/node/node/download V=s || true
          ls -lh dl/ | grep -iE "node-v|nodebin" || echo "⚠ 未见 node 源码包（编译时会再取）"

      # ═══════════════════════════════════════════════════════════════
      # 11. 工具链
      #     CMAKE_POLICY_VERSION_MINIMUM：runner 的 CMake 新版本会拒收
      #     cmake_minimum_required<3.5 的老项目（tools/dwarves 等）
      # ═══════════════════════════════════════════════════════════════
      - name: 编译工具链
        working-directory: src
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          ulimit -n 4096
          echo "线程数: ${{ github.event.inputs.threads }}"
          df -h .
          set -o pipefail
          make tools/install -j${{ github.event.inputs.threads }} V=s 2>&1 | tee /tmp/toolchain-build.log
          make toolchain/install -j${{ github.event.inputs.threads }} V=s 2>&1 | tee -a /tmp/toolchain-build.log
          df -h .

      # ═══════════════════════════════════════════════════════════════
      # 12. 内核（kmod 打包前置；顺便验证工具链真的能用）
      # ═══════════════════════════════════════════════════════════════
      - name: 编译内核
        working-directory: src
        run: |
          ulimit -n 4096
          set -o pipefail
          make target/linux/compile -j${{ github.event.inputs.threads }} V=s 2>&1 \
            | tee /tmp/kernel-build.log | tail -30
          for f in vmlinux modules.builtin drivers/net/ppp/pppox.ko; do
            p=$(ls build_dir/target-*/linux-ipq40xx_generic/linux-*/$f 2>/dev/null | head -1)
            [ -n "$p" ] && echo "✓ $f" || echo "· $f 未生成（不一定需要）"
          done

      # ═══════════════════════════════════════════════════════════════
      # 13. host 依赖
      # ═══════════════════════════════════════════════════════════════
      - name: 预编译 host 依赖
        working-directory: src
        run: |
          ulimit -n 4096
          make package/feeds/packages/python3/host/compile \
            -j${{ github.event.inputs.threads }} V=s || true

      # ═══════════════════════════════════════════════════════════════
      # 14. 编译 node
      #     apk 模式下若 SIGN_EACH_PACKAGE=y，mkpkg 需要 private-key.pem，
      #     而单包编译不会触发密钥生成（只有整树 package/compile 才会），
      #     这里按 package/Makefile 的定义自己补上，避免签名失败。
      # ═══════════════════════════════════════════════════════════════
      - name: 编译 node 包
        working-directory: src
        run: |
          set -o pipefail
          ulimit -n 4096

          if [ "${PKG_FORMAT}" = "apk" ] && grep -q "^CONFIG_SIGN_EACH_PACKAGE=y" .config; then
            if [ ! -f private-key.pem ]; then
              echo "生成 apk 签名密钥（SIGN_EACH_PACKAGE=y）"
              openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem
            fi
            [ -f public-key.pem ] || openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

          echo "════ node ${{ github.event.inputs.node_major }}.x / ${PKG_FORMAT} / -j${{ github.event.inputs.threads }} ════"
          make package/feeds/node/node/compile -j${{ github.event.inputs.threads }} V=s 2>&1 \
            | tee /tmp/node-build.log

      # ═══════════════════════════════════════════════════════════════
      # 15. 收集产物
      #     格式以「实际产物」为准（探测与实际冲突时自动纠正，不再靠假设）
      #     依赖清单从 node Makefile 的 DEPENDS 读取，避免写死包名
      # ═══════════════════════════════════════════════════════════════
      - name: 收集产物
        working-directory: src
        run: |
          mkdir -p out
          ARCH=$(grep '^CONFIG_TARGET_ARCH_PACKAGES=' .config | cut -d'"' -f2)
          [ -n "$ARCH" ] || ARCH=arm_cortex-a7_neon-vfpv4

          PKGDIR="bin/packages/$ARCH/node"
          if [ ! -d "$PKGDIR" ]; then
            hit=$(find bin/packages -maxdepth 3 -type f \
                    \( -name 'node[0-9]*_*.ipk' -o -name 'node[0-9]*-*.apk' \) 2>/dev/null | head -1)
            [ -n "$hit" ] && PKGDIR=$(dirname "$hit") || true
          fi
          echo "包目录: $PKGDIR"
          ls -lh "$PKGDIR" || { echo "❌ 包目录不存在"; exit 1; }

          # ---- 用真实文件判断格式（不信任何探测结果）----
          has_apk=$(ls "$PKGDIR"/node[0-9]*-*.apk 2>/dev/null | wc -l)
          has_ipk=$(ls "$PKGDIR"/node[0-9]*_*.ipk 2>/dev/null | wc -l)
          if [ "$has_apk" -gt 0 ]; then
            FMT=apk
          elif [ "$has_ipk" -gt 0 ]; then
            FMT=ipk
          else
            echo "❌ 目录里既没有 node*.apk 也没有 node*.ipk"
            ls -lh "$PKGDIR"
            exit 1
          fi
          echo "实际格式: $FMT   包架构: $ARCH"
          echo "PKG_FORMAT=$FMT" >> "$GITHUB_ENV"

          shopt -s nullglob
          if [ "$FMT" = "apk" ]; then
            NODE_PKGS=("$PKGDIR"/node[0-9]*-*.apk)
            NPM_PKGS=("$PKGDIR"/node-npm-*.apk)
          else
            NODE_PKGS=("$PKGDIR"/node[0-9]*_*.ipk)
            NPM_PKGS=("$PKGDIR"/node-npm_*.ipk)
          fi
          shopt -u nullglob

          [ ${#NODE_PKGS[@]} -gt 0 ] || { echo "❌ 没找到 node<ABI> 本体"; exit 1; }
          [ ${#NPM_PKGS[@]} -gt 0 ]  || { echo "❌ 没找到 node-npm"; exit 1; }
          cp -v "${NODE_PKGS[@]}" "${NPM_PKGS[@]}" out/

          # ---- 依赖名：从 Makefile 的 DEPENDS 解析 ----
          MK=package/feeds/node/node/Makefile
          DEPNAMES=$(awk '
            {
              line = $0
              if (!inf && line ~ /^[ \t]*DEPENDS[ \t]*:?=/) inf = 1
              if (inf) {
                cont = (line ~ /\\[ \t]*$/)
                sub(/\\[ \t]*$/, "", line)
                gsub(/[ \t]+/, " ", line)
                buf = buf " " line
                if (!cont) { print buf; inf = 0; buf = "" }
              }
            }' "$MK" \
            | sed 's/^[^=]*=[ \t]*//' | tr ' ' '\n' | sed 's/^+//' \
            | grep -E '^[A-Za-z0-9][A-Za-z0-9._+-]*$' \
            | grep -vE '^(node|node-any)$' | sort -u)
          echo "DEPENDS 解析: $(echo $DEPNAMES)"

          copy_dep() {
            d="$1"
            if [ "$FMT" = "apk" ]; then
              find bin/packages bin/targets -maxdepth 5 -type f \
                \( -name "${d}-*.apk" -o -name "${d}[0-9]*-*.apk" \) \
                -exec cp -f {} out/ \; 2>/dev/null || true
            else
              find bin/packages bin/targets -maxdepth 5 -type f \
                \( -name "${d}_*.ipk" -o -name "${d}[0-9]*_*.ipk" \) \
                -exec cp -f {} out/ \; 2>/dev/null || true
            fi
          }

          # 注意：libc / libgcc1 故意不随包 —— 它们是固件基础件，
          # 版本不一致时装上去比不装更危险，路由器本来就有。
          for d in $DEPNAMES libstdcpp libatomic zlib \
                   libopenssl libopenssl-conf libopenssl-legacy \
                   libnghttp2 libcares; do
            case "$d" in libc|libgcc1) continue ;; esac
            copy_dep "$d"
          done

          echo "════ 依赖核对 ════"
          for d in $DEPNAMES; do
            if [ "$FMT" = "apk" ]; then
              n=$(ls out/"$d"-*.apk out/"$d"[0-9]*-*.apk 2>/dev/null | wc -l)
            else
              n=$(ls out/"$d"_*.ipk out/"$d"[0-9]*_*.ipk 2>/dev/null | wc -l)
            fi
            if [ "$n" -gt 0 ]; then
              printf '  ✓ %-22s %s 个\n' "$d" "$n"
            else
              printf '  · %-22s 未随包（路由器现有源可提供）\n' "$d"
            fi
          done

          # 只有「.config 里明确选中」的可选依赖，缺了才算失败
          for need in libopenssl-conf libopenssl-legacy; do
            if grep -q "^CONFIG_PACKAGE_${need}=y" .config; then
              if [ "$FMT" = "apk" ]; then
                ls out/"$need"-*.apk >/dev/null 2>&1 || { echo "❌ 已选中但缺 $need"; exit 1; }
              else
                ls out/"$need"_*.ipk >/dev/null 2>&1 || { echo "❌ 已选中但缺 $need"; exit 1; }
              fi
            fi
          done

          # 反解 ABI / 版本
          NODE_FILE=$(basename "${NODE_PKGS[0]}")
          if [ "$FMT" = "apk" ]; then
            _b="${NODE_FILE%.apk}"                 # node137-24.22.2-r1
            NODE_ABI="${_b#node}"; NODE_ABI="${NODE_ABI%%-*}"
            NODE_VER="${_b#node${NODE_ABI}-}"
          else
            _b="${NODE_FILE%.ipk}"                 # node137_24.22.2-1_arm_...
            NODE_ABI="${_b#node}"; NODE_ABI="${NODE_ABI%%_*}"
            NODE_VER="${_b#node${NODE_ABI}_}"
            NODE_VER="${NODE_VER%_${ARCH}}"
          fi

          echo "════ out/ 共 $(ls out/*.$FMT 2>/dev/null | wc -l) 个 .$FMT ════"
          echo "本体: $NODE_FILE  (ABI=$NODE_ABI  version=$NODE_VER)"
          ls -lh out/
          {
            echo "NODE_VER=$NODE_VER"
            echo "NODE_ABI=$NODE_ABI"
          } >> "$GITHUB_ENV"

      # ═══════════════════════════════════════════════════════════════
      # 16. 索引
      #     apk：apk mkndx → packages.adb（apk-tools 3，immortalwrt master）
      #     ipk：自写解析器 → Packages / Packages.gz（含 opkg 字段顺序修正）
      # ═══════════════════════════════════════════════════════════════
      - name: 生成源索引
        if: github.event.inputs.gen_index == 'true'
        working-directory: src/out
        run: |
          FMT="${PKG_FORMAT:-ipk}"
          echo "格式: $FMT"

          if [ "$FMT" = "apk" ]; then
            APKBIN=../staging_dir/host/bin/apk
            [ -x "$APKBIN" ] || { echo "❌ 缺 host apk：$APKBIN"; exit 1; }
            echo "apk: $("$APKBIN" --version 2>&1 | head -1)"
            ls *.apk >/dev/null 2>&1 || { echo "❌ 没有 .apk"; exit 1; }

            # 与 immortalwrt package/Makefile 的 $(curdir)/merge-index 一致
            if "$APKBIN" mkndx --root .. --keys-dir .. --allow-untrusted \
                 --output packages.adb *.apk; then
              ls -lh packages.adb
              echo "──── 索引内容（抽查）────"
              "$APKBIN" adbdump packages.adb 2>/dev/null | grep -E "name:|version:" | head -20 || true
              echo "✅ packages.adb 就绪（apk-tools 3 源索引）"
            else
              echo "❌ apk mkndx 失败"
              exit 1
            fi
            exit 0
          fi

          python3 <<'PYEOF'
          import glob, hashlib, io, os, subprocess, tarfile, traceback

          def control_from_tar(fileobj):
              with tarfile.open(fileobj=fileobj, mode="r:*") as t:
                  for m in t.getnames():
                      if m.rstrip("/").split("/")[-1] == "control":
                          return t.extractfile(m).read().decode("utf-8", "replace")
              raise RuntimeError("control 文件未找到")

          def read_control(path):
              with open(path, "rb") as f:
                  magic = f.read(8)
              # 新格式：整包是 gzip tar（24.10+）
              if magic[:2] == b"\x1f\x8b" or magic[:5] == b"\xfd7zXZ":
                  with tarfile.open(path, "r:*") as t:
                      for m in t.getnames():
                          base = m.rstrip("/").split("/")[-1]
                          if base.startswith("control.tar"):
                              return control_from_tar(io.BytesIO(t.extractfile(m).read()))
                  raise RuntimeError("外层 tar 无 control.tar")
              # 老格式：ar 归档
              if magic[:7] == b"!<arch>":
                  members = subprocess.run(["ar", "t", path], capture_output=True,
                                           text=True, check=True).stdout.split()
                  ctl = [m for m in members if "control.tar" in m]
                  if not ctl:
                      raise RuntimeError("ar 中无 control.tar")
                  raw = subprocess.run(["ar", "p", path, ctl[0]],
                                       capture_output=True, check=True).stdout
                  return control_from_tar(io.BytesIO(raw))
              raise RuntimeError("未知 ipk 封装，文件头=%r" % magic)

          def parse(ctl):
              fields, desc, cur = {}, [], None
              for line in ctl.splitlines():
                  if line.startswith(" ") or (line == "" and desc):
                      if cur == "Description":
                          desc.append(line if line else " .")
                      continue
                  if ": " in line:
                      k, v = line.split(": ", 1)
                      fields[k] = v
                      cur = k
              return fields, desc

          entries, failed = [], []
          for ipk in sorted(glob.glob("*.ipk")):
              try:
                  fields, desc = parse(read_control(ipk))
                  if "Package" not in fields or "Version" not in fields:
                      raise RuntimeError("control 缺 Package/Version")
                  out = []
                  # Filename/Size/SHA256sum 必须在 Description 之前：
                  # opkg 解析 Description 时遇空行即结束记录，排在其后的字段会被吞，
                  # 表现就是 "does not have a valid filename field"
                  for k in ["Package", "Version", "Depends", "Provides",
                            "Conflicts", "Architecture", "Installed-Size"]:
                      if k in fields:
                          out.append("%s: %s" % (k, fields[k]))
                  out.append("Filename: %s" % ipk)
                  out.append("Size: %d" % os.path.getsize(ipk))
                  out.append("SHA256sum: %s"
                             % hashlib.sha256(open(ipk, "rb").read()).hexdigest())
                  head = fields.get("Description", "").rstrip()
                  body = list(desc)
                  while body and body[-1].strip() in ("", "."):
                      body.pop()
                  if head:
                      out.append("Description: %s" % head)
                      out.extend(body)
                  entries.append("\n".join(out) + "\n\n")
                  print("✓ %-45s %s" % (ipk, fields["Package"]))
              except Exception as e:
                  failed.append(ipk)
                  print("✗ %s -> %s" % (ipk, e))
                  traceback.print_exc()

          with open("Packages", "w") as f:
              f.write("".join(entries))
          print("\n完成: %d 入索引, %d 失败" % (len(entries), len(failed)))

          blocks = [b for b in open("Packages").read().split("\n\n") if b.strip()]
          bad = []
          for b in blocks:
              lb = b.splitlines()
              for need in ("Package", "Version", "Architecture",
                           "Filename", "Size", "SHA256sum"):
                  if not any(l.startswith(need + ":") for l in lb):
                      bad.append("%s 缺 %s" % (lb[0] if lb else "?", need))
          if bad:
              print("✗ 自校验失败：")
              [print("   " + x) for x in bad]
              raise SystemExit(1)
          print("✓ 自校验通过：%d 条，字段齐全" % len(blocks))

          if not glob.glob("node[0-9]*_*.ipk"):
              raise SystemExit("❌ 没有 node<ABI>_*.ipk")
          if failed:
              raise SystemExit("❌ 无法解析: %s" % " ".join(failed))
          PYEOF
          gzip -kf Packages
          ls -lh Packages Packages.gz
          grep -E "^Package:|^Version:" Packages || true

      # ═══════════════════════════════════════════════════════════════
      # 17. 发布
      # ═══════════════════════════════════════════════════════════════
      - name: 发布到 Releases
        if: github.event.inputs.make_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: node-v${{ env.NODE_VER || 'latest' }}
          name: node ${{ env.NODE_VER || 'latest' }} (${{ env.NODE_ABI || '?' }}) arm_cortex-a7_neon-vfpv4
          body: |
            nxhack node ${{ env.NODE_VER || 'latest' }}（ABI ${{ env.NODE_ABI || '?' }}）
            目标：ASUS RT-AC42U / RT-ACRH17，ipq40xx，arm_cortex-a7_neon-vfpv4

            - 源码：${{ github.event.inputs.source_repo }} @ ${{ github.event.inputs.source_ref || 'master' }}
            - nxhack：${{ env.NXBRANCH }}
            - 打包格式：${{ env.PKG_FORMAT }}（跟随源码自身设定）
            - 主版本：${{ github.event.inputs.node_major }}.x

            安装（依赖已随附；libc / libgcc1 属于固件基础件，刻意不打包）：

            apk 固件（immortalwrt master, apk-tools 3）：
            ```
            apk add --allow-untrusted ./*.apk
            ```
            ipk 固件：
            ```
            opkg install ./*.ipk
            ```

            自建源：
            - apk：`packages.adb` 与全部 `.apk` 放同一目录，`/etc/apk/repositories`
              写**到文件的完整 URL**（如 `https://host/node/packages.adb`）。
              apk 3 靠 `.adb` 后缀判定索引类型，写目录会去找老式 APKINDEX.tar.gz。
            - ipk：`Packages` + `Packages.gz` + 全部 `.ipk`。
          files: |
            src/out/*

      # ═══════════════════════════════════════════════════════════════
      # 18. 兜底上传
      # ═══════════════════════════════════════════════════════════════
      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ env.NODE_VER || 'latest' }}-${{ env.PKG_FORMAT || 'pkg' }}-${{ env.SOURCE_TAG || 'src' }}
          path: src/out/
          if-no-files-found: warn
          retention-days: 30

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/toolchain-build.log
            /tmp/kernel-build.log
            /tmp/node-build.log
          if-no-files-found: warn
          retention-days: 30
