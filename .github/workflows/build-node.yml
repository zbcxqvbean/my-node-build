name: Build node ipk (ipq40xx / ASUS RT-AC42U / armv7)

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "OpenWrt 源码仓库（两个源默认都走 master）"
        required: true
        default: "coolsnowwolf/lede"
        type: choice
        options:
          - coolsnowwolf/lede
          - immortalwrt/immortalwrt
      source_ref:
        description: "源码分支/tag（留空 = 默认 master；immortalwrt 建议保持 master 与本地固件同源）"
        required: false
        default: ""
      node_major:
        description: "node 主版本（20 仅 24.10 分支；26 仅 25.12/master；没有 23）"
        required: true
        default: "24"
        type: choice
        options:
          - "20"
          - "22"
          - "24"
          - "26"
      nxhack_branch:
        description: "nxhack 分支（与源码匹配：master 源码→master；24.10→openwrt-24.10）"
        required: true
        default: "openwrt-24.10"
        type: choice
        options:
          - openwrt-24.10
          - openwrt-25.12
          - master
      runner_os:
        description: "runner 系统（24.04 是验证过的，26 未验证）"
        required: true
        default: "ubuntu-24.04"
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-latest
      threads:
        description: "编译线程数（工具链用 -j2 稳，node 阶段可开大）"
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "3"
          - "4"
      gen_index:
        description: "是否生成 opkg 源索引（Packages/Packages.gz）"
        required: true
        default: true
        type: boolean
      make_release:
        description: "编译成功后是否发布到 Releases"
        required: true
        default: true
        type: boolean

permissions:
  contents: write   # make_release 需要：创建 release 和上传产物

# 同一工作流：新触发时自动取消还在跑的旧 run（省 4 小时白跑）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner_os }}
    timeout-minutes: 350

    steps:
      # ═══════════════════════════════════════════════════════════
      # 1. 主机依赖
      #    = immortalwrt 官方 install-deps 清单（全量，不精简）
      #      + coolsnowwolf/lede 额外项（libfuse-dev / libnsl-dev / xz-utils）
      #      + nxhack README 要求（gcc-multilib / g++-multilib / libatomic1）
      #    包名已按 Ubuntu 24.04 (noble) 实测校正：
      #      gnutls-dev      是虚拟包 → 用实体名 libgnutls28-dev
      #      libncurses5-dev / libncursesw5-dev 是 transitional → 用 libncurses-dev
      #      libz-dev        由 zlib1g-dev 提供（已含）
      #      mkisofs         由 genisoimage 提供（已含）
      # ═══════════════════════════════════════════════════════════
      - name: 安装主机依赖
        timeout-minutes: 30   # 超过 30 分钟必是卡死，快速失败而非挂 5 小时
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT="sudo -E apt-get -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          $APT update
          $APT install --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk \
            g++-multilib gcc-multilib genisoimage gettext git \
            gperf haveged help2man intltool \
            lib32gcc-s1 libatomic1 libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libgnutls28-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libnsl-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev \
            lld llvm lrzsz msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-docutils \
            python3-pip python3-ply python3-pyelftools python3-setuptools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs unzip upx-ucl vim wget xmlto xxd xz-utils \
            zlib1g-dev zstd
          echo "════════ 依赖自检 ════════"
          for c in gcc g++ make cmake ninja python3 pkg-config swig \
                   dtc lld ld.lld re2c zstd ack; do
            printf '%-12s %s\n' "$c" "$(command -v $c || echo '缺失')"
          done
          echo "gcc     : $(gcc --version | head -1)"
          echo "python3 : $(python3 --version)"
          ls /usr/include/yaml.h /usr/include/gnutls/gnutls.h >/dev/null 2>&1 \
            && echo "头文件: yaml.h / gnutls.h 就位" || true

      # ═══════════════════════════════════════════════════════════
      # 2. 源码（coolsnowwolf/lede 或 immortalwrt/immortalwrt）
      #    两个源目录结构、feeds 机制、ipq40xx 设备定义完全一致，
      #    差别只在 repo 地址和默认分支。
      # ═══════════════════════════════════════════════════════════
      - name: 拉取 OpenWrt 源码
        run: |
          REPO="${{ github.event.inputs.source_repo }}"
          REF="${{ github.event.inputs.source_ref }}"
          if [ -z "$REF" ]; then
            REF="master"   # 两个源都默认 master，与本地固件保持同源
          fi
          echo "repo=$REPO  ref=$REF"
          echo "SOURCE_TAG=$(echo "$REPO" | tr '/' '-')-$(echo "$REF" | tr '/' '-')" >> "$GITHUB_ENV"

          git clone "https://github.com/$REPO.git" src
          cd src
          git checkout "$REF"

          echo "== HEAD =="
          git log -1 --format="%H  %cd  %s"
          echo "== 目标板内核版本 =="
          grep -E "KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER" target/linux/ipq40xx/Makefile || true
          echo "== 架构 =="
          grep -E "^ARCH:=|^CPU_TYPE:=|^CPU_SUBTYPE:=" target/linux/ipq40xx/Makefile || true
          echo "== 打包格式探测 =="
          if [ -f include/package-ipkg.mk ]; then echo "ipkg 独立实现（老式，固定出 ipk）"; fi
          if [ -f include/package-pack.mk ]; then echo "package-pack.mk（双格式，由 CONFIG_USE_APK 决定 ipk/apk）"; fi
          echo -n "USE_APK 默认值: "
          awk '/^[[:space:]]*config USE_APK/{f=1} f&&/default/{print $2; exit}' config/Config-build.in 2>/dev/null || echo "未找到（老式源码，无双格式）"

      # ═══════════════════════════════════════════════════════════
      # 3. 缓存 dl（只缓存源码 tarball）
      # ═══════════════════════════════════════════════════════════
      - name: 缓存 dl 源码包
        uses: actions/cache@v4
        with:
          path: src/dl
          key: openwrt-dl-${{ hashFiles('src/include/version.mk') }}-v4
          restore-keys: |
            openwrt-dl-

      # ═══════════════════════════════════════════════════════════
      # 3.5 ccache（二次编译提速：node 及各依赖包的重编译命中缓存）
      # ═══════════════════════════════════════════════════════════
      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-node-${{ github.event.inputs.node_major }}-${{ hashFiles('src/include/version.mk') }}-v1
          restore-keys: ccache-node-

      # ═══════════════════════════════════════════════════════════
      # 4. 板级配置（只为确定目标架构 arm_cortex-a7_neon-vfpv4）
      # ═══════════════════════════════════════════════════════════
      - name: 写入板级配置
        working-directory: src
        run: |
          # 强制出 ipk（opkg），不用 apk。
          # immortalwrt master 的 config/Config-build.in 里 USE_APK 是 default y，
          # 但 include/package-pack.mk 是双分支实现：
          #   CONFIG_USE_APK 为空  → ipkg-build → <pkg>_<ver>_<arch>.ipk
          #   CONFIG_USE_APK=y    → apk mkpkg  → <pkg>-<ver>.apk
          # 所以显式关掉就能在 master 上继续出 ipk，装到 opkg 固件上。
          cat > .config <<'EOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_asus_rt-ac42u=y

          CONFIG_CCACHE=y

          # CONFIG_USE_APK is not set

          CONFIG_FEED_packages=y
          CONFIG_FEED_luci=y
          CONFIG_FEED_routing=y
          CONFIG_FEED_telephony=y
          CONFIG_FEED_node=y
          EOF

          # 两个源都必须有这台设备，否则 defconfig 会静默回落到 Generic，
          # 虽然架构一样能编，但明确失败更省时间
          if grep -q "asus_rt-ac42u" target/linux/ipq40xx/image/generic.mk; then
            echo "✓ 设备定义存在: asus_rt-ac42u"
          else
            echo "❌ 该源码没有 asus_rt-ac42u 设备定义"
            grep -E "define Device/asus" target/linux/ipq40xx/image/generic.mk || true
            exit 1
          fi
          echo "板级配置已写入"

      # ═══════════════════════════════════════════════════════════
      # 5. 官方 feeds
      # ═══════════════════════════════════════════════════════════
      - name: 安装官方 feeds
        working-directory: src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "== 源码自带 node 检查 =="
          # lede / immortalwrt 的 packages feed 都有 node；即便没有也不影响
          # （nxhack feed 会提供 node），所以这里只做提示不失败
          ls -d package/feeds/packages/node 2>/dev/null || echo "（packages feed 无 node，将以 nxhack 为准）"

      # ═══════════════════════════════════════════════════════════
      # 6. 接入 nxhack —— 严格按官方 README 五步
      #
      #    ① feeds.conf.default 加 src-git node <url>
      #    ② ./scripts/feeds update node
      #    ③ rm package/feeds/packages/node
      #       rm package/feeds/packages/node-*
      #    ④ ./scripts/feeds install -a -p node
      #    ⑤ make defconfig
      #
      #    注意：-p 后面是 feed 名（src-git 的第二个字段），不是包名。
      # ═══════════════════════════════════════════════════════════
      - name: 接入 nxhack node feed
        working-directory: src
        run: |
          NXBRANCH="${{ github.event.inputs.nxhack_branch }}"
          echo "nxhack 分支: $NXBRANCH"

          # ① 登记 feed
          sed -i '/openwrt-node-packages/d' feeds.conf.default
          echo "src-git node https://github.com/nxhack/openwrt-node-packages.git;$NXBRANCH" >> feeds.conf.default
          echo "===== feeds.conf.default ====="
          cat feeds.conf.default

          # ② 更新该 feed
          ./scripts/feeds update node

          # ③ 删除 coolsnowwolf 自带 node 与全部 node-* 包
          rm -rf package/feeds/packages/node
          rm -rf package/feeds/packages/node-*

          # ④ 从 node feed 安装全部包
          ./scripts/feeds install -a -p node

          # ⑤ 校验
          echo "===== 校验 nxhack 落地 ====="
          test -d package/feeds/node/node || { echo "❌ package/feeds/node/node 不存在"; exit 1; }
          ls package/feeds/node/ | head -10
          echo "===== nxhack 分支与提交 ====="
          git -C feeds/node log -1 --format="%H %cd %s" 2>/dev/null || echo "(feeds 目录非 git)"
          echo "===== node Makefile 版本 ====="
          grep -E "PKG_VERSION" package/feeds/node/node/Makefile || true

      # ═══════════════════════════════════════════════════════════
      # 7. 选定 node 主版本并 defconfig（只做一次，之后绝不改 .config）
      #
      #    nxhack 的 node Makefile 用 choice 控制版本，且列表随分支/更新变化
      #    （实测 2026-11）：
      #      openwrt-24.10 : 20 / 22 / 24（默认 22）
      #      openwrt-25.12 : 22 / 24 / 26（默认 24）
      #      master        : 22 / 24 / 26（默认 24）
      #    ABI 号决定产物包名前缀：
      #      20.x→node115  22.x→node127  24.x→node137  26.x→node147
      #    从来没有 23（奇数版本非 LTS）。
      #    所以下面「选择版本」步骤必须校验，收集步骤必须动态匹配 node<ABI>_。
      # ═══════════════════════════════════════════════════════════
      - name: 选择 node 版本并 defconfig
        working-directory: src
        run: |
          MAJOR="${{ github.event.inputs.node_major }}"
          echo "════════ 选择 node ${MAJOR}.x ════════"

          cat >> .config <<EOF
          CONFIG_NODEJS_${MAJOR}=y
          CONFIG_NODEJS_ICU_SMALL=y
          CONFIG_NODEJS_HOST_BIN=y
          CONFIG_PACKAGE_node=y
          CONFIG_PACKAGE_node-npm=y
          CONFIG_PACKAGE_libopenssl-legacy=y
          EOF

          make defconfig

          # ① 版本必须真的生效：feed 分支不支持该版本时，symbol 会被
          #    defconfig 静默丢掉，回落默认 24 —— 那就会编错版本还看不出来
          if ! grep -q "^CONFIG_NODEJS_${MAJOR}=y" .config; then
            echo "❌ 当前 nxhack 分支不支持 node ${MAJOR}.x"
            echo "---- .config 里的 NODEJS 选项 ----"
            grep -E "^CONFIG_NODEJS_|^# CONFIG_NODEJS_" .config || true
            echo "---- Makefile 支持的版本 ----"
            grep -nE "config NODEJS_|default NODEJS_" package/feeds/node/node/Makefile || true
            echo "提示：openwrt-24.10 → 20/22/24；openwrt-25.12 或 master → 22/24/26"
            exit 1
          fi

          # ② 必须是 ipk 模式（opkg 固件只能装 ipk）。
          #    板级配置里已写死 "# CONFIG_USE_APK is not set"，
          #    这里只做最终校验：如果它被 defconfig 又打开了，说明该源码
          #    不支持 ipk 打包（或符号名变了），必须当场失败而不是白编几小时。
          if grep -q "^CONFIG_USE_APK=y" .config; then
            echo "❌ 仍然是 apk 模式，产物会是 .apk，opkg 固件装不了"
            echo "---- 当前打包相关配置 ----"
            grep -E "^CONFIG_USE_APK|^# CONFIG_USE_APK" .config || true
            echo "---- 源码打包实现 ----"
            ls -l include/package-ipkg.mk include/package-pack.mk 2>/dev/null || true
            grep -n "PACK_\$(1):=" include/package-pack.mk 2>/dev/null | head -4 || true
            exit 1
          fi
          echo "✅ 打包格式: ipk（CONFIG_USE_APK 未启用）"

          echo "════════ 最终配置核对 ════════"
          grep -E "CONFIG_TARGET_BOARD=|CONFIG_TARGET_PROFILE=|CONFIG_TARGET_ARCH_PACKAGES=" .config || true
          grep -E "^CONFIG_NODEJS_" .config || echo "⚠ 无 NODEJS_ 项"
          grep -E "^CONFIG_PACKAGE_node" .config || echo "⚠ node 未选中"
          grep -q "^CONFIG_PACKAGE_libopenssl-legacy=y" .config \
            && echo "libopenssl-legacy: 已选中" \
            || echo "libopenssl-legacy: 该源码没有此包，跳过"

          echo "════════ Makefile 版本分支 ════════"
          grep -nE "^PKG_VERSION|^NODE_MODULE_VERSION|^ifeq \(\\\$\(CONFIG_NODEJS_" \
            package/feeds/node/node/Makefile || true
          echo "目标架构: $(grep '^CONFIG_TARGET_ARCH_PACKAGES=' .config | cut -d'"' -f2 || echo '未知')"

      # ═══════════════════════════════════════════════════════════
      # 8. 下载源码包（node tarball 约 90MB）
      # ═══════════════════════════════════════════════════════════
      - name: 下载 node 源码包
        working-directory: src
        run: |
          make package/feeds/node/node/download V=s || true
          echo "== dl 中的 node =="
          ls -lh dl/ | grep -iE "node-v|nodebin" || echo "⚠ 未见 node 源码包"

      # ═══════════════════════════════════════════════════════════
      # 9. 编译工具链
      #    -j2 保守（编 gcc 时单进程内存峰值高，-j4 在 16G runner 上易 OOM）
      #    日志落盘 /tmp/toolchain-build.log，失败时也能下载
      # ═══════════════════════════════════════════════════════════
      - name: 编译工具链
        working-directory: src
        run: |
          # GitHub runner 的 CMake 是 4.x，会拒绝 cmake_minimum_required < 3.5 的老项目
          # （本次失败点：tools/dwarves）。设此变量让 CMake 4 兼容 3.5 策略。
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          ulimit -n 4096
          echo "════════ 资源检查 ════════"
          free -h
          df -h .
          nproc
          cmake --version
          echo "════════ 本次编译线程数: ${{ github.event.inputs.threads }} ════════"
          echo "════════ tools/install 开始 $(date -u +%H:%M:%S) ════════"
          set -o pipefail
          make tools/install -j${{ github.event.inputs.threads }} V=s 2>&1 | tee /tmp/toolchain-build.log
          echo "════════ tools/install 完成 $(date -u +%H:%M:%S) ════════"
          echo "════════ toolchain/install 开始 $(date -u +%H:%M:%S) ════════"
          make toolchain/install -j${{ github.event.inputs.threads }} V=s 2>&1 | tee -a /tmp/toolchain-build.log
          echo "════════ toolchain/install 完成 $(date -u +%H:%M:%S) ════════"
          echo "== 磁盘剩余 =="
          df -h .

      # ═══════════════════════════════════════════════════════════
      # 10. ⚠ 关键新增：先编译内核
      #
      #     上一轮失败的真正原因：make node/compile 会触发全量依赖，
      #     其中包含 package/kernel/linux，而 kmod-pppox 需要
      #     linux-5.10.272/drivers/net/ppp/pppox.ko
      #     → 内核没编 → .ko 不存在 → kmod 打包失败 → Error 2
      #
      #     这里先把内核编出来，kmod 才能正常打包。
      # ═══════════════════════════════════════════════════════════
      - name: 编译内核（kmod 依赖前置）
        working-directory: src
        run: |
          ulimit -n 4096
          echo "════════ 内核编译开始（线程数 ${{ github.event.inputs.threads }}）: $(date -u +%H:%M:%S) ════════"
          set -o pipefail
          make target/linux/compile -j${{ github.event.inputs.threads }} V=s 2>&1 | tee /tmp/kernel-build.log | tail -50
          echo "内核编译结束: $(date -u +%H:%M:%S)"
          echo "== 产物核验 =="
          for f in vmlinux modules.builtin drivers/net/ppp/pppox.ko; do
            p=$(ls build_dir/target-*/linux-ipq40xx_generic/linux-*/$f 2>/dev/null | head -1)
            if [ -n "$p" ]; then echo "✓ $f"; else echo "✗ $f 缺失"; fi
          done

      # ═══════════════════════════════════════════════════════════
      # 11. 预编译 host 依赖
      # ═══════════════════════════════════════════════════════════
      - name: 预编译 host 依赖
        working-directory: src
        run: |
          ulimit -n 4096
          make package/feeds/packages/python3/host/compile -j${{ github.event.inputs.threads }} V=s || true

      # ═══════════════════════════════════════════════════════════
      # 12. 编译 node ipk
      # ═══════════════════════════════════════════════════════════
      - name: 编译 node ipk
        working-directory: src
        run: |
          set -o pipefail
          ulimit -n 4096
          echo "════════ 目标: node ${{ github.event.inputs.node_major }}.x / 线程数 ${{ github.event.inputs.threads }} / 开始 $(date -u +%H:%M:%S) ════════"
          make package/feeds/node/node/compile -j${{ github.event.inputs.threads }} V=s 2>&1 | tee /tmp/node-build.log
          echo "════════ 结束: $(date -u +%H:%M:%S) ════════"

      # ═══════════════════════════════════════════════════════════
      # 13. 收集产物
      #
      #     node 本体包名前缀 = ABI 号，随主版本变化：
      #       node127（22.x）/ node137（24.x）/ node147（26.x）
      #     所以只能用 node<数字>_ 通配，绝不能写死 node137。
      #     npm 固定叫 node-npm。
      #
      #     完整运行时依赖（依据 = Makefile 的 DEPENDS 行 + 构建日志实证）：
      #       DEPENDS:= +libstdcpp +libopenssl +zlib +libnghttp2
      #                 +libcares +libatomic
      # ═══════════════════════════════════════════════════════════
      - name: 收集产物（node + npm + 全部运行时依赖）
        working-directory: src
        run: |
          mkdir -p out

          # 架构从 .config 读，避免两个源命名差异
          ARCH=$(grep '^CONFIG_TARGET_ARCH_PACKAGES=' .config | cut -d'"' -f2)
          [ -n "$ARCH" ] || ARCH=arm_cortex-a7_neon-vfpv4
          echo "包架构: $ARCH"
          PKGDIR=bin/packages/$ARCH/node
          echo "════════ $PKGDIR 内容 ════════"
          ls -lh "$PKGDIR" || { echo "❌ 包目录不存在"; exit 1; }

          shopt -s nullglob
          NODE_IPKS=("$PKGDIR"/node[0-9]*_*.ipk)
          NPM_IPKS=("$PKGDIR"/node-npm_*.ipk)
          shopt -u nullglob

          if [ ${#NODE_IPKS[@]} -eq 0 ]; then
            echo "❌ 未找到 node<ABI>_*.ipk，目录实际内容："
            ls -lh "$PKGDIR"
            exit 1
          fi
          if [ ${#NPM_IPKS[@]} -eq 0 ]; then
            echo "❌ 未找到 node-npm_*.ipk"
            exit 1
          fi
          cp -v "${NODE_IPKS[@]}" out/
          cp -v "${NPM_IPKS[@]}" out/

          # 运行时依赖（包名来自 DEPENDS；版本号通配）
          # libc_ 写死下划线，避免误匹配 libcares_ 等
          for pat in "libstdcpp6_*" "libatomic1_*" "libgcc1_*" "libc_*" \
                     "zlib_*" "libopenssl3_*" "libopenssl-conf_*" \
                     "libopenssl-legacy_*" "libnghttp2-14_*" "libcares_*"; do
            find bin/packages bin/targets -name "${pat}.ipk" \
              -exec cp -v {} out/ \; 2>/dev/null || true
          done

          echo "════════ out/ ════════"
          ls -lh out/

          # 硬校验：Makefile DEPENDS 里必有的六个
          for need in libstdcpp6 libatomic1 zlib libopenssl3 libnghttp2-14 libcares; do
            ls out/${need}_*.ipk > /dev/null 2>&1 || { echo "❌ 缺依赖 $need"; exit 1; }
          done
          # 可选依赖：.config 里选中了就必须有产物
          # （immortalwrt/openwrt 某些版本没有 libopenssl-legacy 这个包）
          for need in libopenssl-conf libopenssl-legacy; do
            if grep -q "^CONFIG_PACKAGE_${need}=y" .config; then
              ls out/${need}_*.ipk > /dev/null 2>&1 || { echo "❌ 缺依赖 $need"; exit 1; }
            fi
          done

          NODE_FILE=$(basename "${NODE_IPKS[0]}")
          # node137_24.22.2-1_arm_cortex-a7_neon-vfpv4.ipk
          #   → ABI=137, 版本=24.22.2-1
          # 不能用贪婪 sed（arch 里也有下划线，会截错）
          NODE_ABI="${NODE_FILE#node}"
          NODE_ABI="${NODE_ABI%%_*}"
          NODE_VER="${NODE_FILE#node${NODE_ABI}_}"
          NODE_VER="${NODE_VER%_${ARCH}.ipk}"
          echo "✅ 收集完成，共 $(ls out/*.ipk | wc -l) 个 ipk"
          echo "node 本体: $NODE_FILE  (ABI=$NODE_ABI, version=$NODE_VER)"
          sha256sum out/*.ipk

          # 把实际版本/ABI 写进环境，供 artifact 命名、Release 和索引使用
          {
            echo "NODE_VER=$NODE_VER"
            echo "NODE_ABI=$NODE_ABI"
          } >> "$GITHUB_ENV"

      # ═══════════════════════════════════════════════════════════
      # 14. 生成 opkg 源索引（Packages / Packages.gz）
      #
      #     两种 ipk 封装都要支持：
      #       ① 新格式：整个 ipk 是 gzip tar，内含 ./control.tar.gz
      #          （OpenWrt 24.10 及 lede 新 ipkg-build 的实际产物）
      #       ② 老格式：ar 归档，内含 control.tar.gz
      #     先看文件头魔数判断，避免 ar 报错直接中断。
      # ═══════════════════════════════════════════════════════════
      - name: 生成 opkg 源索引
        if: github.event.inputs.gen_index == 'true'
        working-directory: src/out
        run: |
          python3 <<'PYEOF'
          import glob, hashlib, io, os, subprocess, tarfile, traceback

          def control_from_tar(fileobj):
              """从 control.tar.* 里取出 control 文本"""
              with tarfile.open(fileobj=fileobj, mode="r:*") as t:
                  for m in t.getnames():
                      if m.rstrip("/").split("/")[-1] == "control":
                          return t.extractfile(m).read().decode("utf-8", "replace")
              raise RuntimeError("control 文件未找到")

          def read_control(path):
              with open(path, "rb") as f:
                  magic = f.read(8)

              # ① 新格式：gzip tar（OpenWrt 24.10+）
              if magic[:2] == b"\x1f\x8b" or magic[:5] == b"\xfd7zXZ":
                  with tarfile.open(path, "r:*") as t:
                      for m in t.getnames():
                          base = m.rstrip("/").split("/")[-1]
                          if base.startswith("control.tar"):
                              return control_from_tar(io.BytesIO(t.extractfile(m).read()))
                  raise RuntimeError("外层 tar 中无 control.tar")

              # ② 老格式：ar 归档
              if magic[:7] == b"!<arch>":
                  members = subprocess.run(["ar", "t", path], capture_output=True,
                                           text=True, check=True).stdout.split()
                  ctl = [m for m in members if "control.tar" in m]
                  if not ctl:
                      raise RuntimeError("ar 中无 control.tar")
                  raw = subprocess.run(["ar", "p", path, ctl[0]],
                                       capture_output=True, check=True).stdout
                  return control_from_tar(io.BytesIO(raw))

              raise RuntimeError("未知 ipk 封装，文件头=%r" % magic)

          def parse(ctl):
              fields, desc = {}, []
              cur = None
              for line in ctl.splitlines():
                  if line.startswith(" ") or (line == "" and desc):
                      if cur == "Description":
                          desc.append(line if line else " .")
                      continue
                  if ": " in line:
                      k, v = line.split(": ", 1)
                      fields[k] = v
                      cur = k
              return fields, desc

          entries, failed = [], []
          for ipk in sorted(glob.glob("*.ipk")):
              try:
                  fields, desc = parse(read_control(ipk))
                  if "Package" not in fields or "Version" not in fields:
                      raise RuntimeError("control 缺 Package/Version")
                  out = []
                  # 顺序必须与官方 Packages 一致：Filename/Size/SHA256sum
                  # 一定放在 Description 之前。opkg 解析 Description 时会
                  # 把后续以空格开头的行当作描述续行，遇到空行即判定记录
                  # 结束；一旦描述块的续行边界有任何偏差，排在 Description
                  # 之后的字段就会被吞掉，导致 opkg install 报
                  # "does not have a valid filename field"。
                  for k in ["Package", "Version", "Depends", "Provides",
                            "Conflicts", "Architecture", "Installed-Size"]:
                      if k in fields:
                          out.append("%s: %s" % (k, fields[k]))
                  out.append("Filename: %s" % ipk)
                  out.append("Size: %d" % os.path.getsize(ipk))
                  out.append("SHA256sum: %s"
                             % hashlib.sha256(open(ipk, "rb").read()).hexdigest())
                  # Description 永远放最后，续行统一 " ."（空行）表示，
                  # 去掉末尾多余的 " ."，避免多出一个空描述行
                  head = fields.get("Description", "").rstrip()
                  body = list(desc)
                  while body and body[-1].strip() in ("", "."):
                      body.pop()
                  if head:
                      out.append("Description: %s" % head)
                      out.extend(body)
                  entries.append("\n".join(out) + "\n\n")
                  print("✓ %-45s %s" % (ipk, fields["Package"]))
              except Exception as e:
                  failed.append(ipk)
                  print("✗ %s -> %s" % (ipk, e))
                  traceback.print_exc()

          with open("Packages", "w") as f:
              f.write("".join(entries))
          print("\n完成: %d 个包入索引, %d 个失败" % (len(entries), len(failed)))

          # 自校验：按 opkg 的方式（空行分条）逐条检查关键字段，
          # 少一个就失败，避免又生成一份装不上的索引
          blocks = [b for b in open("Packages").read().split("\n\n") if b.strip()]
          bad = []
          for b in blocks:
              lines_b = b.splitlines()
              tag = lines_b[0] if lines_b else "?"
              for need in ("Package", "Version", "Architecture",
                           "Filename", "Size", "SHA256sum"):
                  if not any(l.startswith(need + ":") for l in lines_b):
                      bad.append("%s 缺 %s" % (tag, need))
          if bad:
              print("✗ 索引自校验失败：")
              for x in bad:
                  print("   " + x)
              raise SystemExit(1)
          print("✓ 索引自校验通过：%d 条，字段齐全" % len(blocks))

          # 只有 node 本体读不出来才算致命；依赖包个别失败不影响
          if not glob.glob("node[0-9]*_*.ipk"):
              raise SystemExit("❌ out/ 中没有 node<ABI>_*.ipk")
          if failed:
              raise SystemExit("❌ 以下 ipk 无法解析: %s" % " ".join(failed))
          PYEOF
          gzip -kf Packages
          ls -lh Packages Packages.gz
          echo "════════ Packages 内容预览 ════════"
          grep -E "^Package:|^Version:|^Size:" Packages || true

      # ═══════════════════════════════════════════════════════════
      # 15. 发布到 Releases（可选，由 make_release 开关控制）
      # ═══════════════════════════════════════════════════════════
      - name: 发布到 Releases
        if: github.event.inputs.make_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: node-v${{ env.NODE_VER || 'latest' }}
          name: node ${{ env.NODE_VER || 'latest' }} (arm_cortex-a7_neon-vfpv4)
          body: |
            nxhack node ${{ env.NODE_VER || 'latest' }}，目标设备 ASUS RT-AC42U / ACRH17
            （ipq40xx，arm_cortex-a7_neon-vfpv4）

            - 源码：${{ github.event.inputs.source_repo }} @ ${{ github.event.inputs.source_ref || 'master（默认）' }}
            - node 主版本：${{ github.event.inputs.node_major }}.x（ABI ${{ env.NODE_ABI || '?' }}）
            - nxhack feed：${{ github.event.inputs.nxhack_branch }}

            安装：opkg install node${{ env.NODE_ABI }}_*.ipk node-npm_*.ipk
            （依赖包已随附；若本地 opkg 源已同步索引，可直接
             opkg update && opkg install node${{ env.NODE_ABI }}）
          files: |
            src/out/*

      # ═══════════════════════════════════════════════════════════
      # 16. 上传：无论索引是否成功，ipk 都要传出来（不让 4 小时白跑）
      # ═══════════════════════════════════════════════════════════
      - name: 上传 ipk + 索引
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ env.NODE_VER || 'latest' }}-${{ env.SOURCE_TAG || 'src' }}-arm_cortex-a7_neon-vfpv4
          path: src/out/
          if-no-files-found: error
          retention-days: 30

      - name: 上传全部编译日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/toolchain-build.log
            /tmp/kernel-build.log
            /tmp/node-build.log
          if-no-files-found: warn
          retention-days: 30
