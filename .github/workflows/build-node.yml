                     "zlib_*" "libopenssl3_*" "libopenssl-conf_*" \
                     "libopenssl-legacy_*" "libnghttp2-14_*" "libcares_*"; do
            find bin/packages bin/targets -name "${pat}.ipk" \
              -exec cp -v {} out/ \; 2>/dev/null || true
          done

          echo "════════ out/ ════════"
          ls -lh out/

          # 硬校验：DEPENDS 清单里的每个依赖包都必须收集到
          for need in libstdcpp6 libatomic1 zlib libopenssl3 libnghttp2-14 libcares; do
            ls out/${need}_*.ipk > /dev/null 2>&1 || { echo "❌ 缺依赖 $need"; exit 1; }
          done
          echo "✅ 收集完成，共 $(ls out/*.ipk | wc -l) 个 ipk"
          echo "node 版本: $(ls out/node137_*.ipk | sed 's/.*node137_\(.*\)_.*/\1/')"
          sha256sum out/*.ipk

          # 把实际版本号写进环境，供上传步骤命名 artifact
          echo "NODE_VER=$(ls out/node137_*.ipk | sed 's/.*node137_\(.*\)_.*/\1/')" >> "$GITHUB_ENV"

      # ═══════════════════════════════════════════════════════════
      # 14. 生成 opkg 源索引（Packages / Packages.gz / Packages.manifest）
      #     只对 out/ 里这 12 个 ipk 建索引，不掺 bin/packages 里其他包，
      #     保证索引自洽（不会出现指向不存在文件的条目）
      #     用 lede 自带的 scripts/opkg-make-index
      # ═══════════════════════════════════════════════════════════
      - name: 生成 opkg 源索引
        working-directory: lede
        run: |
          cd out
          "$GITHUB_WORKSPACE/lede/scripts/opkg-make-index" -a . > Packages
          gzip -kf Packages
          ls -lh Packages Packages.gz
          echo "════════ Packages 内容预览 ════════"
          grep -E "^Package:|^Version:|^Depends:" Packages

      - name: 上传 ipk + 索引
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ env.NODE_VER }}-arm_cortex-a7_neon-vfpv4
          path: lede/out/
          retention-days: 30

      - name: 上传全部编译日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/toolchain-build.log
            /tmp/kernel-build.log
            /tmp/node-build.log
          if-no-files-found: warn
          retention-days: 30
